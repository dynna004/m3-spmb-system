<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMA Muhammadiyah 3 Yogyakarta - Sistem Integrasi SPMB & TU</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>

<body>

  <!-- Dynamic Header -->
  <div id="app-header-container"></div>

  <!-- Modular Navigation Tabs -->
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchModule('01')">01. Portal SPMB</button>
    <button class="tab-btn" onclick="switchModule('02')">02. Admin SPMB</button>
    <button class="tab-btn" onclick="switchModule('03')">03. Keuangan SPMB</button>
    <button class="tab-btn" onclick="switchModule('04')">04. Wawancara</button>
    <button class="tab-btn" onclick="switchModule('05')">05. Kelulusan</button>
    <button class="tab-btn" onclick="switchModule('06')">06. Verifikasi Loket</button>
    <button class="tab-btn" onclick="switchModule('07')">07. Lock Data</button>
    <button class="tab-btn" onclick="switchModule('08')">08. Schema TU</button>
    <button class="tab-btn" onclick="switchModule('09')">09. Dashboard TU</button>
    <button class="tab-btn" onclick="switchModule('10')">10. Executive Report</button>
  </nav>

  <!-- Module Content Workspace -->
  <main class="container">
    <div id="module-viewport"></div>
  </main>

  <script type="module">
    import { renderHeader } from './shared/header-footer.js?v=20261012_v6';
    import { renderPortalSPMB } from './modules/01_portal_spmb/portal.js?v=20261015_v2';
    import { renderAdminSPMB } from './modules/02_admin_spmb/admin.js?v=20261012_v6';
    import { renderKeuangan } from './modules/03_keuangan_spmb/keuangan.js?v=20261012_v6';
    import { renderWawancara } from './modules/04_wawancara_spmb/wawancara.js?v=20261015_pewawancara_v2';
    import { renderKelulusan } from './modules/05_kelulusan_spmb/kelulusan.js?v=20261012_v6';
    import { renderLoketDaftarUlang } from './modules/06_verifikasi_loket/loket.js?v=20261018_v2';
    import { renderLockValidasi } from './modules/07_pengelolaan_data/lock.js?v=20261018_v1';
    import { renderSchemaTU } from './modules/08_basis_data_tu/schema.js?v=20261018_v1';
    import { renderTUDashboard } from './modules/09_pemanfaatan_tu/tu_dashboard.js?v=20261019_v2';
    import { renderExecutiveReport } from './modules/10_executive_report/report.js?v=20261012_v6';

    // Render Shared Header
    renderHeader();

    // Router function terpusat
    window.switchModule = function (moduleId) {
      // Update tab active UI hanya untuk bilah navigasi utama
      const mainTabs = document.querySelectorAll('nav.nav-tabs .tab-btn');
      mainTabs.forEach(tab => tab.classList.remove('active'));

      const activeTab = Array.from(mainTabs).find(tab => tab.textContent.trim().startsWith(moduleId));
      if (activeTab) activeTab.classList.add('active');

      const viewport = 'module-viewport';
      window.location.hash = moduleId;

      switch (moduleId) {
        case '01': renderPortalSPMB(viewport); break;
        case '02': renderAdminSPMB(viewport); break;
        case '03': renderKeuangan(viewport); break;
        case '04': renderWawancara(viewport); break;
        case '05': renderKelulusan(viewport); break;
        case '06': renderLoketDaftarUlang(viewport); break;
        case '07': renderLockValidasi(viewport); break;
        case '08': renderSchemaTU(viewport); break;
        case '09': renderTUDashboard(viewport); break;
        case '10': renderExecutiveReport(viewport); break;
        default: renderPortalSPMB(viewport);
      }
    };

    // Auto-detect modul dari URL hash (misal #05 untuk langsung buka Modul Kelulusan)
    const initialHash = window.location.hash.replace('#', '').trim();
    if (initialHash && ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10'].includes(initialHash)) {
      switchModule(initialHash);
    } else {
      switchModule('01');
    }
  </script>
</body>

</html>
