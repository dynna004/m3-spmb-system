<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun - Portal SPMB SMA Muhammadiyah 3 Yogyakarta</title>
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    .portal-container {
      max-width: 560px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }
    .portal-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #006837 0%, #004d28 100%);
      color: white;
      border-radius: 14px;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 12px rgba(0, 104, 55, 0.25);
    }
    .form-label-req::after {
      content: " *";
      color: #ef4444;
    }
    .input-hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.25rem;
      display: flex;
      justify-content: space-between;
    }
    .input-error {
      border-color: #ef4444 !important;
    }
    .alert-box {
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-danger {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert-success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .nav-steps {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .step-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e2e8f0;
      color: #64748b;
    }
    .step-pill.active {
      background: #006837;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="portal-container">
    <div class="nav-steps">
      <span class="step-pill active">1. Registrasi Akun</span>
      <span class="step-pill">2. Status Aktivasi</span>
      <span class="step-pill">3. Login Pendaftar</span>
      <span class="step-pill">4. Formulir & Bukti</span>
    </div>

    <div class="portal-card">
      <div class="brand-header">
        <div class="brand-logo">M3</div>
        <h2 style="font-size: 1.4rem; font-weight: 700; color: #0f172a;">Registrasi Akun Awal</h2>
        <p style="color: #64748b; font-size: 0.85rem; margin-top: 4px;">SMA Muhammadiyah 3 Yogyakarta (T.A. 2026/2027)</p>
      </div>

      <div id="alert-msg" class="alert-box"></div>

      <form id="form-register">
        <div class="form-group">
          <label for="nama" class="form-label-req">Nama Lengkap</label>
          <input type="text" id="nama" class="form-control" placeholder="Nama lengkap sesuai ijazah/KK" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label for="email" class="form-label-req">Email</label>
            <input type="email" id="email" class="form-control" placeholder="nama@domain.com" required>
          </div>

          <div class="form-group">
            <label for="no_wa" class="form-label-req">No. WhatsApp</label>
            <input type="text" id="no_wa" class="form-control" placeholder="081234567890" required>
          </div>
        </div>

        <div class="form-group">
          <label for="nisn" class="form-label-req">NISN (Nomor Induk Siswa Nasional)</label>
          <input type="text" id="nisn" class="form-control" maxlength="10" placeholder="10 digit angka NISN" pattern="[0-9]{10}" required>
          <div class="input-hint">
            <span>Wajib tepat 10 digit angka</span>
            <span id="nisn-counter">0 / 10</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label-req">Password Akun</label>
          <input type="password" id="password" class="form-control" placeholder="Min. 6 karakter (kombinasi huruf & angka)" required>
          <div style="font-size: 0.72rem; color: #64748b; margin-top: 4px;">
            Password diamankan dengan hashing SHA-256.
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 12px; font-size: 1rem;">
          Daftar Akun Baru
        </button>

        <p style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #64748b;">
          Sudah punya akun? <a href="login.html" style="color: #006837; font-weight: 600; text-decoration: none;">Login Pendaftar</a>
        </p>
      </form>
    </div>
  </div>

  <script type="module">
    import { getPendaftarList, savePendaftar, hashPassword, isValidEmail, isValidNoWA, isValidPassword } from './utils.js';

    const nisnInput = document.getElementById('nisn');
    const nisnCounter = document.getElementById('nisn-counter');
    const formRegister = document.getElementById('form-register');
    const alertMsg = document.getElementById('alert-msg');

    // Filter & live counter NISN
    nisnInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 10);
      nisnCounter.textContent = `${e.target.value.length} / 10`;
      if (e.target.value.length === 10) {
        nisnInput.classList.remove('input-error');
      }
    });

    function showAlert(msg, isError = true) {
      alertMsg.className = `alert-box ${isError ? 'alert-danger' : 'alert-success'}`;
      alertMsg.innerHTML = msg;
      alertMsg.style.display = 'block';
    }

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value.trim();
      const email = document.getElementById('email').value.trim();
      const noWa = document.getElementById('no_wa').value.trim();
      const nisn = nisnInput.value.trim();
      const password = document.getElementById('password').value;

      // 1. Validasi NISN (Tepat 10 digit)
      if (!/^[0-9]{10}$/.test(nisn)) {
        nisnInput.classList.add('input-error');
        showAlert('NISN wajib diisi dengan tepat 10 digit angka!');
        return;
      }

      // 2. Validasi Format Email
      if (!isValidEmail(email)) {
        showAlert('Format email tidak valid! Gunakan format contoh: nama@domain.com');
        return;
      }

      // 3. Validasi Format No. WhatsApp
      if (!isValidNoWA(noWa)) {
        showAlert('Format No. WhatsApp tidak valid! Gunakan format Indonesia (contoh: 081234567890).');
        return;
      }

      // 4. Validasi Kriteria Password (Min 6 Karakter, Huruf + Angka)
      if (!isValidPassword(password)) {
        showAlert('Password tidak memenuhi syarat! Minimal 6 karakter dan wajib mengombinasikan huruf dan angka.');
        return;
      }

      // Check Duplikasi NISN / Email
      const pendaftarList = getPendaftarList();
      if (pendaftarList.some(p => p.nisn === nisn)) {
        showAlert('NISN ini sudah terdaftar! Silakan menuju halaman Login.');
        return;
      }
      if (pendaftarList.some(p => p.email === email)) {
        showAlert('Email ini sudah terdaftar! Gunakan email lain.');
        return;
      }

      // Hash Password sebelum disimpan
      const hashedPassword = await hashPassword(password);

      const regId = `REG-2026-${String(pendaftarList.length + 1).padStart(3, '0')}`;
      const newAccount = {
        id_pendaftar: regId,
        nama_lengkap: nama,
        email: email,
        no_wa: noWa,
        nisn: nisn,
        password_hash: hashedPassword,
        status_akun: 'pending_activation',
        created_at: new Date().toISOString(),
        biodata: null,
        pembayaran: null
      };

      // Simpan ke central storage spmb_pendaftar_db
      savePendaftar(newAccount);
      localStorage.setItem('m3_spmb_current_user', JSON.stringify(newAccount));

      showAlert('<strong>Registrasi Berhasil!</strong> Akun berstatus <code>pending_activation</code>. Mengalihkan ke Halaman Status...', false);

      setTimeout(() => {
        window.location.href = 'status-akun.html';
      }, 1200);
    });
  </script>
</body>
</html>
